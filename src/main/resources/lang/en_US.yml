  - '%prefix%&e/vmse pause [player|all]&7 - Pause/resume music'
  - '%prefix%&e/vmse vmsg <file>&7 - Send a Voice Message'
  - '%prefix%&e/vmse list&7 - List music'
  - '%prefix%&e/vmse reload [config|lang]&7 - Reload configuration/language'
  - '%prefix%&e/vmse surround [player|me] [stereo|5.1|mono]&7 - Surround layout'
  - '%prefix%&e/vmse playlist <create|add|remove|play|stop|mode|list> ...&7 - Playlists'
  - '%prefix%&e/vmse region <create|remove|list|info> ...&7 - Music regions'
  - '%prefix%&e/vmse hoe&7 - Get the golden hoe tool'
  - '%prefix%&e/vmse effect list&7 - List effect presets'
  - '%prefix%&e/vmse effect set <preset|off> [player|me]&7 - Set effect'
  - '%prefix%&e/vmse effect info <preset>&7 - Preset details'
  - '%prefix%&b&m----------------------------------------------------'

