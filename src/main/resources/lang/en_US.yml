# ---- Effect presets ----
effect-usage: '%prefix%&e/vmse effect list&7 / &e/vmse effect set <preset|off> [player|me]&7 / &e/vmse effect info <preset>'
effect-list-header: '%prefix%&bAvailable effect presets:'
effect-list-entry: '%prefix%&7- &e{id} &7({label}) &8bass={bass} mid={mid} treble={treble}'
effect-set-usage: '%prefix%&e/vmse effect set <preset|off> [player|me]'
effect-set: '%prefix%&aEffect set to: &e{preset}'
effect-set-other: '%prefix%&aEffect set for &e{player}&a: &e{preset}'
effect-not-found: '%prefix%&cEffect preset not found: &e{id}'
effect-info: '%prefix%&b{preset} &7(id={id})&r\n%prefix%&7  bass={bass}  mid={mid}  treble={treble}'
